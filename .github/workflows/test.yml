name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ./core
      - run: python -m pip install -e ./adapters --no-deps
      - run: python -m pip install pytest hpack
      - run: python scripts/check_versions.py
      - run: python -m pytest -q
      - run: python scripts/check_wheels.py
