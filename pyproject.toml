[project]
name = "agy-proxy"
version = "0.0.10"
description = "Gemini / OpenAI compatible reverse proxy backed by the Antigravity CLI (`agy`) stream-json duplex mode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pyte>=0.8.2,<0.9",
    "uvicorn>=0.30",
]

[project.scripts]
agy-proxy = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # asyncio subprocess pipe transports outlive the TestClient event loop on Windows
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
