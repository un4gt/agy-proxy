[project]
name = "agy-proxy"
version = "0.0.17"
description = "Development workspace for agy-proxy core and protocol adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "orjson>=3.10,<4",
    "pillow>=12.2,<13",
    "pyte>=0.8.2,<0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "hpack==4.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "adapters"]

[tool.pytest.ini_options]
pythonpath = [".", "core", "adapters"]
testpaths = ["tests", "core/tests", "adapters/tests"]
filterwarnings = [
    # asyncio subprocess pipe transports outlive the TestClient event loop on Windows
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
