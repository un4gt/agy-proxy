[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-proxy-adapters"
version = "0.0.20"
description = "OpenAI, Responses and Anthropic protocol adapters for agy-proxy-core"
requires-python = ">=3.12"
dependencies = [
    "agy-proxy-core==0.0.20",
]

[project.scripts]
agy-proxy = "agy_proxy_adapters.__main__:main"

[tool.setuptools]
packages = ["agy_proxy_adapters"]

[tool.uv.sources]
agy-proxy-core = { workspace = true }
