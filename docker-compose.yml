# agy-proxy：`docker compose up -d` 一条命令启动
# 配置放同目录 .env（模板见 .env.example，服务器上至少填 AGY_PROXY_PASSWORD）
# pull 只更新镜像，不更新服务器上的此文件；旧部署升级前应确认两个数据卷均已挂载。
services:
  agy-proxy:
    image: tumuer/agy-proxy:v0.0.17   # 建议生产固定版本，如 tumuer/agy-proxy:v0.0.17
    # 本地开发想直接从源码构建时，注释掉上面的 image，取消下一行注释：
    # build: .
    container_name: agy-proxy
    ports:
      - "${PORT:-8317}:8317"
    volumes:
      - agy-gemini:/root/.gemini     # agy OAuth 凭据，一次登录长期有效
      - agy-data:/root/.agy-proxy    # 整体持久化 API Key、用量、隔离账号凭据/固定身份和绑定
    environment:
      AGY_PROXY_BIN: ${AGY_PROXY_BIN:-agy}
      AGY_PROXY_PASSWORD: ${AGY_PROXY_PASSWORD:-}
      AGY_PROXY_API_KEYS: ${AGY_PROXY_API_KEYS:-}
      AGY_PROXY_OAUTH_CLIENT_ID: ${AGY_PROXY_OAUTH_CLIENT_ID:-}
      AGY_PROXY_OAUTH_CLIENT_SECRET: ${AGY_PROXY_OAUTH_CLIENT_SECRET:-}
      AGY_PROXY_HTTP_PROXY: ${AGY_PROXY_HTTP_PROXY:-}
      AGY_PROXY_PREWARM_MODELS: ${AGY_PROXY_PREWARM_MODELS:-}
      AGY_PROXY_MAX_SESSIONS: ${AGY_PROXY_MAX_SESSIONS:-8}
      AGY_PROXY_TURN_TIMEOUT: ${AGY_PROXY_TURN_TIMEOUT:-600}
      AGY_PROXY_RECOVERY_ATTEMPTS: ${AGY_PROXY_RECOVERY_ATTEMPTS:-1}
      AGY_PROXY_IDLE_TIMEOUT: ${AGY_PROXY_IDLE_TIMEOUT:-0}
      AGY_PROXY_STREAM_HEARTBEAT: ${AGY_PROXY_STREAM_HEARTBEAT:-10}
      AGY_PROXY_SESSION_TTL: ${AGY_PROXY_SESSION_TTL:-1800}
      AGY_PROXY_MODELS_TTL: ${AGY_PROXY_MODELS_TTL:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 下容器访问宿主机代理用
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  agy-gemini:
  agy-data:
